<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Segunda - Webchat</title>

  <!-- Librería y estilos oficiales de Dialogflow CX (v1) -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    df-messenger {
      z-index: 999;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      --df-messenger-chat-window-width: 80vw;
    }

    /* Estilo de la tarjeta réplica de WhatsApp */
    .custom-whatsapp-card {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      font-family: Arial, sans-serif;
    }

    .custom-whatsapp-title {
      font-size: 14px;
      color: #222222;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .custom-whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-top: 1px solid #f0f0f0;
      padding-top: 10px;
      color: #B93221;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .custom-whatsapp-btn:hover {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>

  <df-messenger
      id="df-widget"
      location="us-east1"
      project-id="l2-np-dialogflow2-us-es1-desa"
      agent-id="93ea4d6a-4948-41b7-a2a2-e6dc1a3a37d0"
      language-code="es">
    <df-messenger-chat chat-title="LaSegunda-clientes-v4"></df-messenger-chat>
  </df-messenger>

  <script>
    const URL_COTIZAR = "https://www.lasegundaonline.com.ar/?utm_source=Whatsapp&utm_medium=wspatcliene&utm_campaign=cotizonlineatclientewsp&utm_id=cotizwspatcliente";

    // Escuchar respuestas recibidas desde el evento nativo de Dialogflow
    window.addEventListener('df-response-received', function (event) {
      try {
        const rawMessages = event.detail?.raw?.queryResult?.responseMessages 
                         || event.detail?.data?.queryResult?.responseMessages 
                         || event.detail?.messages 
                         || [];

        rawMessages.forEach(msg => {
          // 1. Si trae un Custom Payload con 'actions' (WhatsApp)
          if (msg.payload && msg.payload.actions) {
            const action = msg.payload.actions[0] || {};
            renderCardInChat(msg.payload.text, action.uri || URL_COTIZAR, action.text || "Cotizar");
          } 
          // 2. Si trae un texto estándar relativo a la cotización
          else if (msg.text && Array.isArray(msg.text.text)) {
            const fullText = msg.text.text.join(" ");
            if (fullText.includes("cotización en lugar de hacerlo por la web")) {
              renderCardInChat(
                "Cotizá tu seguro: Auto, Hogar, Accidentes Personales, Vida, Retiro ¡y más!😉",
                URL_COTIZAR,
                "Cotizar"
              );
            }
          }
        });
      } catch (err) {
        console.error("Error al procesar df-response-received:", err);
      }
    }, true);

    function renderCardInChat(titleText, buttonLink, buttonLabel) {
      setTimeout(() => {
        const dfWidget = document.querySelector('df-messenger');
        if (!dfWidget) return;

        // Intentar ubicar el wrapper interno
        const chat = dfWidget.shadowRoot ? dfWidget.shadowRoot.querySelector('df-messenger-chat') : document.querySelector('df-messenger-chat');
        if (!chat) return;

        // En v1, df-messenger deja insertar elementos directamente como hijos de df-messenger-chat
        const cardContainer = document.createElement('div');
        cardContainer.className = 'custom-whatsapp-card';
        cardContainer.innerHTML = `
          <div class="custom-whatsapp-title">${titleText}</div>
          <a class="custom-whatsapp-btn" href="${buttonLink}" target="_blank" rel="noopener noreferrer">
            <span>🔗</span> ${buttonLabel}
          </a>
        `;

        chat.appendChild(cardContainer);
      }, 200);
    }
  </script>

</body>
</html>
