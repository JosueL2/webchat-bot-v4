<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Segunda - Webchat</title>

  <!-- Librería y estilos oficiales de Dialogflow CX -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">

  <style>
    body { 
      margin: 0; 
      font-family: Arial, sans-serif; 
    }

    df-messenger {
      z-index: 999;
      position: fixed;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      --df-messenger-chat-window-width: 80vw;
    }
  </style>
</head>
<body>

<df-messenger
    id="df-widget"
    location="us-east1"
    project-id="l2-np-dialogflow2-us-es1-desa"
    agent-id="93ea4d6a-4948-41b7-a2a2-e6dc1a3a37d0"
    language-code="es">
  <df-messenger-chat chat-title="LaSegunda-clientes-v4"></df-messenger-chat>
</df-messenger>

<script>
  // 1. Interceptamos la respuesta HTTP nativa antes de que el webchat la procese
  const originalFetch = window.fetch;

  window.fetch = async function(...args) {
    const response = await originalFetch.apply(this, args);
    const url = args[0] ? args[0].toString() : '';

    // Si la llamada es a la API de Dialogflow CX
    if (url.includes('dialogflow') || url.includes('detectIntent') || url.includes('query')) {
      const clone = response.clone();
      
      try {
        const data = await clone.json();

        // 2. Modificamos el JSON de respuesta en memoria
        if (data.queryResult && data.queryResult.responseMessages) {
          data.queryResult.responseMessages.forEach(msg => {
            if (msg.payload && msg.payload.actions) {
              // Convertimos el JSON personalizado a Rich Content nativo
              msg.payload = transformPayloadToRichContent(msg.payload);
            }
          });
        }

        // 3. Devolvemos la respuesta modificada al webchat
        return new Response(JSON.stringify(data), {
          status: response.status,
          statusText: response.statusText,
          headers: response.headers
        });

      } catch (err) {
        console.error("Error al interceptar y modificar el JSON:", err);
      }
    }

    return response;
  };

  // Función que transforma tu JSON actual al formato nativo Rich Content
  function transformPayloadToRichContent(customPayload) {
    const richContentBlocks = [];

    // Si viene texto principal
    if (customPayload.text) {
      richContentBlocks.push({
        type: "info",
        title: customPayload.text
      });
    }

    // Convertimos cada elemento de "actions" a un botón nativo
    if (Array.isArray(customPayload.actions)) {
      customPayload.actions.forEach(action => {
        richContentBlocks.push({
          type: "button",
          icon: {
            type: "chevron_right",
            color: "#B93221"
          },
          text: action.text || "Ver enlace",
          link: action.uri || action.url || action.link || "#"
        });
      });
    }

    return {
      richContent: [ richContentBlocks ]
    };
  }
</script>

</body>
</html>
