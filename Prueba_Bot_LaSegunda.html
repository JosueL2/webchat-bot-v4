<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Segunda - Webchat</title>

  <!-- Librería y estilos oficiales de Dialogflow CX (v1) -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    df-messenger {
      z-index: 999;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      --df-messenger-chat-window-width: 80vw;
    }
  </style>
</head>
<body>

  <df-messenger
      id="df-widget"
      location="us-east1"
      project-id="l2-np-dialogflow2-us-es1-desa"
      agent-id="93ea4d6a-4948-41b7-a2a2-e6dc1a3a37d0"
      language-code="es">
    <df-messenger-chat chat-title="LaSegunda-clientes-v4"></df-messenger-chat>
  </df-messenger>

  <script>
    // Interceptador global de Fetch/XHR que convierte 'actions' a 'richContent'
    const originalFetch = window.fetch;

    window.fetch = async function(...args) {
      const response = await originalFetch.apply(this, args);
      const url = args[0] ? args[0].toString() : '';

      if (url.includes('dialogflow') || url.includes('detectIntent') || url.includes('query')) {
        const clone = response.clone();
        
        try {
          const data = await clone.json();

          // Modificamos el payload en memoria si viene con el formato de WhatsApp
          if (data.queryResult && Array.isArray(data.queryResult.responseMessages)) {
            data.queryResult.responseMessages.forEach(msg => {
              if (msg.payload && msg.payload.actions) {
                const text = msg.payload.text || "Cotizá tu seguro";
                const action = msg.payload.actions[0] || {};

                // Sobrescribimos el payload convirtiéndolo al formato que Webchat SI entiende
                msg.payload = {
                  "richContent": [
                    [
                      {
                        "type": "info",
                        "title": text
                      },
                      {
                        "type": "button",
                        "icon": {
                          "type": "open_in_new",
                          "color": "#B93221"
                        },
                        "text": action.text || "Cotizar",
                        "link": action.uri || action.url || "#"
                      }
                    ]
                  ]
                };
              }
            });
          }

          // Devolvemos la respuesta modificada al Webchat
          return new Response(JSON.stringify(data), {
            status: response.status,
            statusText: response.statusText,
            headers: response.headers
          });

        } catch (err) {
          console.error("Error procesando intercepción:", err);
        }
      }

      return response;
    };
  </script>

</body>
</html>
