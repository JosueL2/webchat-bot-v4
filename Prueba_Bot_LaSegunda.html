<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Segunda - Webchat</title>

  <!-- Librería y estilos oficiales de Dialogflow CX -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">

  <style>
    body { 
      margin: 0; 
      font-family: Arial, sans-serif; 
    }

    df-messenger {
      z-index: 999;
      position: fixed;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      --df-messenger-chat-window-width: 80vw;
    }
  </style>
</head>
<body>

<df-messenger
    id="df-widget"
    location="us-east1"
    project-id="l2-np-dialogflow2-us-es1-desa"
    agent-id="93ea4d6a-4948-41b7-a2a2-e6dc1a3a37d0"
    language-code="es">
  <df-messenger-chat chat-title="LaSegunda-clientes-v4"></df-messenger-chat>
</df-messenger>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const dfMessenger = document.querySelector('df-messenger');

    dfMessenger.addEventListener('df-response-received', function (event) {
      console.group("%c🔎 AUDITORÍA DE PAYLOAD - DF RESPONSE RECEIVED", "color: #B93221; font-weight: bold; font-size: 13px;");
      
      // 1. Objeto de evento completo
      console.log("📄 Event Detail:", event.detail);

      // 2. Extraer mensajes y payloads
      const messages = event.detail?.messages || event.detail?.raw?.queryResult?.responseMessages;
      console.log("💬 Lista de mensajes recibidos:", messages);

      if (messages && Array.isArray(messages)) {
        messages.forEach((msg, idx) => {
          if (msg.payload) {
            console.log(`📦 Payload en mensaje [${idx}]:`, msg.payload);
            
            // Intentar renderizar si tiene 'actions'
            if (msg.payload.actions) {
              console.log("🎨 Intentando renderizar botones de 'actions'...");
              renderCustomActions(msg.payload);
            }
          }
        });
      }

      console.groupEnd();
    });
  });

  // Función para forzar la creación de los botones en el Webchat
  function renderCustomActions(payload) {
    setTimeout(() => {
      const dfMessenger = document.querySelector('df-messenger');
      if (!dfMessenger) return;

      // Buscar el contenedor interno de mensajes
      const chat = dfMessenger.shadowRoot ? dfMessenger.shadowRoot.querySelector('df-messenger-chat') : null;
      const messageList = chat && chat.shadowRoot ? chat.shadowRoot.querySelector('.chat-wrapper') || chat.shadowRoot : null;

      if (!messageList) {
        console.error("❌ No se encontró el contenedor de chat en el ShadowDOM.");
        return;
      }

      const card = document.createElement('div');
      card.style.cssText = "background: #fff; border: 1px solid #ccc; padding: 10px; margin: 8px; border-radius: 8px;";
      
      let html = payload.text ? `<p style="margin: 0 0 8px 0; font-size: 14px;">${payload.text}</p>` : '';
      
      if (Array.isArray(payload.actions)) {
        payload.actions.forEach(action => {
          html += `
            <a href="${action.uri || '#'}" target="_blank" 
               style="display: inline-block; background: #B93221; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold;">
               ${action.text || 'Ver'}
            </a>`;
        });
      }

      card.innerHTML = html;
      messageList.appendChild(card);
      console.log("✅ Botón/Payload insertado dinámicamente en la pantalla.");
    }, 300);
  }
</script>

</body>
</html>
