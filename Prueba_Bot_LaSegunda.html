<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Segunda - Webchat</title>

  <!-- Librería y estilos oficiales de Dialogflow CX (v1) -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    df-messenger {
      z-index: 999;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      --df-messenger-chat-window-width: 80vw;
    }
  </style>
</head>
<body>

  <df-messenger
      id="df-widget"
      location="us-east1"
      project-id="l2-np-dialogflow2-us-es1-desa"
      agent-id="93ea4d6a-4948-41b7-a2a2-e6dc1a3a37d0"
      language-code="es">
    <df-messenger-chat chat-title="LaSegunda-clientes-v4"></df-messenger-chat>
  </df-messenger>

  <script>
    // ------------------------------------------------------------------
    // INTERCEPTADOR DE RED (XMLHttpRequest / Fetch)
    // Transforma cualquier Custom Payload con "actions" a "richContent"
    // ------------------------------------------------------------------

    // 1. Mapeador/Transformador de JSON
    function convertActionsToRichContent(payload) {
      const richContentInner = [];

      // Si trae un texto principal
      if (payload.text) {
        richContentInner.push({
          "type": "info",
          "title": payload.text
        });
      }

      // Si trae el array de "actions" (botones o links)
      if (Array.isArray(payload.actions)) {
        payload.actions.forEach(action => {
          richContentInner.push({
            "type": "button",
            "icon": {
              "type": "open_in_new",
              "color": "#B93221"
            },
            "text": action.text || "Ver más",
            "link": action.uri || action.url || action.link || "#"
          });
        });
      }

      return {
        "richContent": [ richContentInner ]
      };
    }

    // 2. Procesar respuesta del servidor
    function modifyDialogflowResponse(jsonString) {
      try {
        const data = JSON.parse(jsonString);

        if (data.queryResult && Array.isArray(data.queryResult.responseMessages)) {
          data.queryResult.responseMessages.forEach(msg => {
            // Si detectamos la estructura con 'actions' (formato WhatsApp)
            if (msg.payload && msg.payload.actions) {
              console.log("🛠️ Custom Payload con 'actions' detectado. Transformando a richContent nativo...", msg.payload);
              msg.payload = convertActionsToRichContent(msg.payload);
            }
          });
        }
        return JSON.stringify(data);
      } catch (e) {
        return jsonString;
      }
    }

    // 3. Interceptar llamadas XMLHttpRequest (XHR) de df-messenger
    const XHR = XMLHttpRequest.prototype;
    const open = XHR.open;
    const send = XHR.send;

    XHR.open = function(method, url) {
      this._url = url;
      return open.apply(this, arguments);
    };

    XHR.send = function(postData) {
      this.addEventListener('readystatechange', function() {
        if (this.readyState === 4 && this._url && (this._url.includes('dialogflow') || this._url.includes('detectIntent'))) {
          try {
            const modifiedResponseText = modifyDialogflowResponse(this.responseText);
            
            // Sobrescribir la propiedad responseText devuelta al componente
            Object.defineProperty(this, 'responseText', {
              get: function() { return modifiedResponseText; }
            });
            Object.defineProperty(this, 'response', {
              get: function() { return modifiedResponseText; }
            });
          } catch (e) {
            console.error("Error modificando respuesta XHR:", e);
          }
        }
      });
      return send.apply(this, arguments);
    };

    // 4. Interceptar llamadas Fetch de df-messenger
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
      const response = await originalFetch.apply(this, args);
      const url = args[0] ? args[0].toString() : '';

      if (url.includes('dialogflow') || url.includes('detectIntent')) {
        const clone = response.clone();
        try {
          const text = await clone.text();
          const modifiedText = modifyDialogflowResponse(text);

          return new Response(modifiedText, {
            status: response.status,
            statusText: response.statusText,
            headers: response.headers
          });
        } catch (e) {}
      }
      return response;
    };
  </script>

</body>
</html>
